# Hyprlock Configuration

$font = 0xProto Nerd Font
$wt_inner = rgba(17, 17, 27, 0.80)
$wt_outer = rgba(89b4faee) rgba(cba6f7ee) 45deg
$wt_check = rgba(a6e3a1ee) rgba(89b4faee) 120deg
$wt_fail  = rgba(f38ba8ee) rgba(fab387ee) 40deg
$wt_font  = rgb(205, 214, 244)
$wt_dim   = rgb(166, 173, 200)
source = ~/.config/hypr/configs/hyprlock-colors.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2
    inner_color = $wt_inner
    outer_color = $wt_outer
    check_color = $wt_check
    fail_color  = $wt_fail
    font_color  = $wt_font
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $wt_font
    font_size = 84
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $wt_dim
    font_size = 20
    font_family = $font
    position = 0, 45
    halign = center
    valign = center
}
